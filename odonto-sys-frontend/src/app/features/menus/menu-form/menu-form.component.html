<div class="d-flex align-items-center gap-2 mb-4">
  <a routerLink="/menus" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h1 class="h3 mb-0">{{ idMenu() ? 'Editar vista' : 'Nueva vista' }}</h1>
</div>

@if (error()) {
  <div class="alert alert-danger" role="alert">{{ error() }}</div>
}

@if (cargando()) {
  <div class="text-center text-secondary py-5">
    <div class="spinner-border" role="status"></div>
  </div>
} @else {
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <form [formGroup]="formulario" (ngSubmit)="onSubmit()">
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label" for="nombre">Nombre</label>
            <input
              id="nombre"
              type="text"
              class="form-control"
              formControlName="nombre"
              [class.is-invalid]="formulario.controls.nombre.touched && formulario.controls.nombre.invalid"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label" for="idModulo">Módulo</label>
            <select
              id="idModulo"
              class="form-select"
              formControlName="idModulo"
              [class.is-invalid]="formulario.controls.idModulo.touched && formulario.controls.idModulo.invalid"
            >
              <option [ngValue]="null">Seleccione...</option>
              @for (modulo of modulos(); track modulo.idModulo) {
                <option [ngValue]="modulo.idModulo">{{ modulo.nombre }}</option>
              }
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="ruta">Ruta</label>
            <input id="ruta" type="text" class="form-control" formControlName="ruta" placeholder="/ejemplo/ruta" />
          </div>
          <div class="col-md-3">
            <label class="form-label" for="icono">Ícono (Bootstrap Icons)</label>
            <input id="icono" type="text" class="form-control" formControlName="icono" placeholder="bi-gear" />
          </div>
          <div class="col-md-3">
            <label class="form-label" for="orden">Orden</label>
            <input id="orden" type="number" class="form-control" formControlName="orden" />
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a routerLink="/menus" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary" [disabled]="guardando()">
            @if (guardando()) {
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            }
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
}
