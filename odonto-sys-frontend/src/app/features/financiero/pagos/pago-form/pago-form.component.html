<div class="d-flex align-items-center gap-2 mb-4">
  <a routerLink="/pagos" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h1 class="h3 mb-0">{{ idPago() ? 'Editar pago' : 'Nuevo pago' }}</h1>
</div>

@if (error()) {
  <div class="alert alert-danger" role="alert">{{ error() }}</div>
}

@if (cargando()) {
  <div class="text-center text-secondary py-5">
    <div class="spinner-border" role="status"></div>
  </div>
} @else {
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <form [formGroup]="formulario" (ngSubmit)="onSubmit()">
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label">Paciente</label>
            <app-buscador-select
              placeholder="Buscar paciente..."
              [opciones]="opcionesPacientes()"
              [valorSeleccionado]="formulario.controls.idPaciente.value"
              (seleccionCambio)="formulario.controls.idPaciente.setValue($event)"
            />
          </div>
          <div class="col-md-6">
            <label class="form-label">Método de pago</label>
            <select
              class="form-select"
              formControlName="idMetodoPago"
              [class.is-invalid]="formulario.controls.idMetodoPago.touched && formulario.controls.idMetodoPago.invalid"
            >
              <option [ngValue]="null">Seleccione...</option>
              @for (metodo of metodosPago(); track metodo.idMetodoPago) {
                <option [ngValue]="metodo.idMetodoPago">{{ metodo.nombre }}</option>
              }
            </select>
          </div>

          <div class="col-md-4">
            <label class="form-label">Monto en efectivo</label>
            <input type="number" step="0.01" class="form-control" formControlName="montoEfectivo" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Monto con tarjeta</label>
            <input type="number" step="0.01" class="form-control" formControlName="montoTarjeta" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Comisión de tarjeta</label>
            <input type="number" step="0.01" class="form-control" formControlName="comisionTarjeta" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Costo de laboratorio</label>
            <input type="number" step="0.01" class="form-control" formControlName="costoLaboratorio" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Monto bruto</label>
            <input type="number" step="0.01" class="form-control" formControlName="montoBruto" />
          </div>
          <div class="col-md-4">
            <label class="form-label">Monto neto</label>
            <input type="number" step="0.01" class="form-control" formControlName="montoNeto" />
          </div>
        </div>

        <p class="text-secondary small">
          Si indica un monto bruto, la suma de efectivo + tarjeta debe ser igual a ese monto.
        </p>

        <div class="d-flex justify-content-end gap-2">
          <a routerLink="/pagos" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary" [disabled]="guardando()">
            @if (guardando()) {
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            }
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
}
