<div class="d-flex align-items-center gap-2 mb-4">
  <a routerLink="/instrumental" class="btn btn-outline-secondary btn-sm">
    <i class="bi bi-arrow-left"></i>
  </a>
  <h1 class="h3 mb-0">{{ esEntrada ? 'Entrada' : 'Salida' }} de {{ instrumental()?.nombre ?? '...' }}</h1>
</div>

@if (error()) {
  <div class="alert alert-danger" role="alert">{{ error() }}</div>
}

@if (cargando()) {
  <div class="text-center text-secondary py-5">
    <div class="spinner-border" role="status"></div>
  </div>
} @else {
  <div class="card shadow-sm border-0">
    <div class="card-body p-4">
      <form [formGroup]="formulario" (ngSubmit)="onSubmit()">
        <div class="row g-3 mb-4">
          <div class="col-md-6">
            <label class="form-label" for="idTipoMovimiento">Motivo</label>
            <select
              id="idTipoMovimiento"
              class="form-select"
              formControlName="idTipoMovimiento"
              [class.is-invalid]="formulario.controls.idTipoMovimiento.touched && formulario.controls.idTipoMovimiento.invalid"
            >
              <option [ngValue]="null">Seleccione...</option>
              @for (tipo of tiposDisponibles(); track tipo.idTipoMovimiento) {
                <option [ngValue]="tipo.idTipoMovimiento">{{ tipo.nombreMovimiento }}</option>
              }
            </select>
          </div>
          <div class="col-md-6">
            <label class="form-label" for="cantidad">Cantidad</label>
            <input
              id="cantidad"
              type="number"
              min="1"
              class="form-control"
              formControlName="cantidad"
              [class.is-invalid]="formulario.controls.cantidad.touched && formulario.controls.cantidad.invalid"
            />
          </div>
          <div class="col-12">
            <label class="form-label" for="motivo">Nota (opcional)</label>
            <input id="motivo" type="text" class="form-control" formControlName="motivo" />
          </div>
        </div>

        <div class="d-flex justify-content-end gap-2">
          <a routerLink="/instrumental" class="btn btn-outline-secondary">Cancelar</a>
          <button type="submit" class="btn btn-primary" [disabled]="guardando()">
            @if (guardando()) {
              <span class="spinner-border spinner-border-sm me-2" role="status" aria-hidden="true"></span>
            }
            Guardar
          </button>
        </div>
      </form>
    </div>
  </div>
}
